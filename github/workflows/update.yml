name: Automated Sweepstake Update

on:
  schedule:
    - cron: '0 17,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run calculation script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DEPLOYMENT_TIMESTAMP: ${{ github.run_started_at }}
        run: python fetch_and_score.py

      - name: Commit and push changes
        run: |
          git config user.name 'Sweepstake Bot'
          git config user.email 'bot@github.com'
          git add index.html players.html rules.html .version
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Automated matchday update'
            git push
          fi
