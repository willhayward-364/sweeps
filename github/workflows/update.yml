name: Automated Sweepstake Update

on:
  schedule:
    # Triggers daily at 17:00 UTC and 22:00 UTC
    - cron: '0 17,22 * * *'
  workflow_dispatch:

# Explicitly grant repository write access to GITHUB_TOKEN
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate Fetch Heartbeat Timestamp
        id: heartbeat
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "FETCH_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "API Heartbeat generated at: $TIMESTAMP"

      - name: Execute API Fetch & HTML Generation
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DEPLOYMENT_TIMESTAMP: ${{ env.FETCH_TIMESTAMP }}
        run: python fetch_and_score.py

      - name: Write Version Metadata File
        run: |
          echo "${{ env.FETCH_TIMESTAMP }}" > .version

      - name: Commit and Push Updated Site safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add index.html players.html latest_results.html rules.html .version style.css style.css images/

          # Check if there are actual changes before committing to avoid Exit Code 128
          if ! git diff --staged --quiet; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "API Fetch Heartbeat: ${{ env.FETCH_TIMESTAMP }} [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "ℹ️ No changes detected in generated HTML files. Skipping push safely."
          fi