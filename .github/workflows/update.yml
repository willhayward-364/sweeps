name: Automated Sweepstake Update

on:
  schedule:
    # Shortly after matches usually finish (times are UTC). Odd minutes, because
    # GitHub delays scheduled runs most around the top of the hour.
    # Saturday & Sunday: after the lunchtime, 3pm and late kick-offs.
    - cron: '35 14 * * 6,0'
    - cron: '5 17 * * 6,0'
    - cron: '35 19 * * 6,0'
    # Every day: after evening and midweek games.
    - cron: '35 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One update at a time per branch: a run that starts while another is still going
# waits for it, so two runs never try to save at the same moment.
concurrency:
  group: sweepstake-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate Fetch Heartbeat Timestamp
        id: heartbeat
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "FETCH_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "API Heartbeat generated at: $TIMESTAMP"

      - name: Execute API Fetch & HTML Generation
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DEPLOYMENT_TIMESTAMP: ${{ env.FETCH_TIMESTAMP }}
        run: python fetch_and_score.py

      - name: Commit and Push Updated Site safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A

          if ! git diff --staged --quiet; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "API Fetch Heartbeat: ${{ env.FETCH_TIMESTAMP }} [skip ci]"
            # Push back to the branch this run was started on (main for the
            # scheduled runs), so manual runs on other branches never touch main.
            # If someone pushed code while this ran, put this update on top of it
            # (this run's freshly built pages win any clash), then save.
            git pull --rebase -X theirs origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "ℹ️ No changes detected. Skipping push safely."
          fi
