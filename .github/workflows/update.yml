name: Automated Sweepstake Update

on:
  schedule:
    # Triggers daily at 17:00 UTC and 22:00 UTC
    - cron: '0 17,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Generate Fetch Heartbeat Timestamp
        id: heartbeat
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "FETCH_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "API Heartbeat generated at: $TIMESTAMP"

      - name: Execute API Fetch & HTML Generation
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DEPLOYMENT_TIMESTAMP: ${{ env.FETCH_TIMESTAMP }}
        run: python fetch_and_score.py

      - name: Write Version Metadata File
        run: |
          echo "${{ env.FETCH_TIMESTAMP }}" > .version

      - name: Commit and Push Updated Site
        run: |
          git config user.name 'Sweepstake Bot'
          git config user.email 'bot@github.com'

          git add index.html players.html latest_results.html rules.html .version style.css styles.css images/

          git commit -m "API Fetch Heartbeat: ${{ env.FETCH_TIMESTAMP }} [skip ci]"
          git pull --rebase origin main
          git push
